<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('index') }}"><span class="logo">≋</span><span>{{ site_name }}</span></a>
  <span class="tagline">匿名で自由に書き込める掲示板</span>
  <nav>
    <a href="{{ url_for('index') }}">ホーム</a>
    <a class="primary" href="{{ url_for('new_thread') }}">＋ スレッド作成</a>
  </nav>
</header>
{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}<div class="flash-wrap">{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}</div>{% endif %}
{% endwith %}
<main>{% block content %}{% endblock %}</main>
<footer>© 2026 {{ site_name }}</footer>
</body>
</html>
